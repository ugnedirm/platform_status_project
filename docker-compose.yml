services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  monitor:
    build: ./monitor
    volumes:
      - ./logs:/logs
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M