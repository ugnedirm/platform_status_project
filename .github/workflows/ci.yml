name: CI

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Wait a moment for the app to start
        run: sleep 5

      - name: Check the app responds
        run: curl -sf http://localhost:8000/health

      - name: Show logs if it failed
        if: failure()
        run: docker compose logs
